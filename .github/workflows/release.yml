name: "Release Prism Desktop App"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true

jobs:
  # ── Windows build & sign ────────────────────────────────────────────
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      # ── Windows code signing ──────────────────────────────────────
      # Supports two methods (auto-detected by which secrets are set):
      #   A) Azure Trusted Signing (recommended) – no local cert needed
      #   B) PFX certificate import + signtool (traditional EV/Std cert)
      - name: Configure Azure Trusted Signing
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != ''
        shell: pwsh
        run: |
          # Install AzureSignTool via dotnet tool
          dotnet tool install --global AzureSignTool --version 6.0.0
          # Write the signing script that Tauri's signCommand will invoke
          $signPs1 = @"
          Write-Host "Signing with Azure Trusted Signing: `$args[0]"
          AzureSignTool sign `
            --azure-key-vault-url "$env:AZURE_KEY_VAULT_URI" `
            --azure-tenant-id "$env:AZURE_TENANT_ID" `
            --azure-client-id "$env:AZURE_CLIENT_ID" `
            --azure-client-secret "$env:AZURE_CLIENT_SECRET" `
            --certificate-name "$env:AZURE_CERT_NAME" `
            --timestamp-rfc3161 "http://timestamp.digicert.com" `
            --timestamp-digest SHA256 `
            --file-digest SHA256 `
            --description "Prism — Neural Markdown & Knowledge Vault" `
            --description-url "https://github.com/LlamaLotz/Prism" `
            "`$args[0]"
          "@
          echo "WINDOWS_SIGN_PS1=$signPs1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Configure PFX Certificate Signing
        if: env.WINDOWS_PFX_BASE64 != '' && env.AZURE_CLIENT_ID == ''
        shell: pwsh
        run: |
          # Decode and import the EV/Standard code signing certificate
          $pfxPath = "${{ runner.temp }}\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          # Write the signing script that Tauri's signCommand will invoke
          $signPs1 = @"
          Write-Host "Signing with signtool: `$args[0]"
          signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f "$pfxPath" /p "$env:WINDOWS_PFX_PASSWORD" `
            /d "Prism — Neural Markdown & Knowledge Vault" `
            /du "https://github.com/LlamaLotz/Prism" `
            "`$args[0]"
          "@
          echo "WINDOWS_SIGN_PS1=$signPs1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Prism ${{ github.ref_name }}"
          releaseBody: "See the assets below to download Prism for your operating system."
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || true }}
          prerelease: false
          args: '-- --bin app'

      # ── Verify signature on built artifacts ───────────────────────
      - name: Verify Authenticode Signature
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File | Select-Object -First 1
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if ($msi) {
            Write-Host "Verifying MSI: $($msi.FullName)"
            Get-AuthenticodeSignature -FilePath $msi.FullName | Format-List
          }
          if ($exe) {
            Write-Host "Verifying NSIS installer: $($exe.FullName)"
            Get-AuthenticodeSignature -FilePath $exe.FullName | Format-List
          }

  # ── macOS build, sign & notarize ────────────────────────────────────
  release-macos:
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # ── Import Apple Developer ID certificate ────────────────────
      - name: Import Apple Code Signing Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain for the signing certificate
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Decode and import the Developer ID Application certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          # Verify the identity is available
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install Frontend Dependencies
        run: npm ci

      # ── Build universal binary (both Intel + Apple Silicon) ─────
      - name: Build Universal macOS Binary
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing – set signingIdentity in tauri.conf.json
          # to your Developer ID identity string, or leave as "-"
          # and set it here:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Prism ${{ github.ref_name }}"
          releaseBody: "See the assets below to download Prism for your operating system."
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || true }}
          prerelease: false
          args: '--target universal-apple-darwin -- --bin app'

      # ── Notarize the DMG ─────────────────────────────────────────
      - name: Submit for Apple Notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "No DMG found — checking for .app bundle"
            DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          fi
          if [ -z "$DMG" ]; then
            echo "ERROR: No macOS bundle found to notarize"
            exit 1
          fi
          echo "Notarizing: $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

      # ── Staple the notarization ticket ───────────────────────────
      - name: Staple Notarization Ticket
        run: |
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -n "$DMG" ]; then
            xcrun stapler staple "$DMG"
            echo "Stapled: $DMG"
            # Verify
            spctl --assess --verbose=4 --type install "$DMG"
          else
            APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
            xcrun stapler staple "$APP"
            echo "Stapled: $APP"
            spctl --assess --verbose=4 --type execute "$APP"
          fi