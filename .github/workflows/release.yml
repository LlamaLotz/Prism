name: "Release Prism Desktop App"

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Sync version across package.json, tauri.conf.json, and Cargo.toml
        shell: bash
        run: |
          # Strip 'v' prefix from tag (e.g. v1.0.1 -> 1.0.1) and export for node
          export VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing all manifests to version: $VERSION"

          # Guard: tag must be a semantic version
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a semantic version (got '$VERSION')"
            exit 1
          fi

          # 1. package.json + package-lock.json. Skip when already at VERSION —
          #    `npm version` exits 1 with "Version not changed" in that case.
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
          else
            echo "package.json already at $VERSION — skipping npm version"
          fi

          # 2. tauri.conf.json + 3. Cargo.toml via node. Avoids jq (absent on
          #    windows-latest runners) and GNU-only sed address syntax (macOS
          #    ships BSD sed which rejects `0,/re/`).
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;

            const tauriPath = "src-tauri/tauri.conf.json";
            const tauri = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
            tauri.version = v;
            fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + "\n");
            console.log("tauri.conf.json -> " + v);

            const cargoPath = "src-tauri/Cargo.toml";
            const cargo = fs.readFileSync(cargoPath, "utf8");
            const next = cargo.replace(/^version = .*$/m, 'version = "' + v + '"');
            fs.writeFileSync(cargoPath, next);
            console.log("Cargo.toml -> " + v);
          '

          # Sanity check
          echo "--- Cargo.toml ---"
          grep -E '^version =' src-tauri/Cargo.toml
          echo "--- tauri.conf.json ---"
          node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version"
          echo "--- package.json ---"
          node -p "require('./package.json').version"
      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Prism ${{ github.ref_name }}"
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          releaseBody: "See the assets below to download Prism for your operating system."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin -- --bin app' || '-- --bin app' }}