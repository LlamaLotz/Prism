name: "Release Prism Desktop App"

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Synchronize Version from Git Tag
        shell: bash
        run: |
          # Extract version number from tag (e.g., v1.0.1 -> 1.0.1)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Updating app version to $VERSION"

          # Update package.json (and package-lock.json)
          npm version "$VERSION" --no-git-tag-version

          # Update src-tauri/tauri.conf.json
          node -e "
            const fs = require('fs');
            const file = './src-tauri/tauri.conf.json';
            const config = JSON.parse(fs.readFileSync(file));
            config.version = '$VERSION';
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          "

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Prism ${{ github.ref_name }}"
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          releaseBody: "See the assets below to download Prism for your operating system."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin -- --bin app' || '-- --bin app' }}