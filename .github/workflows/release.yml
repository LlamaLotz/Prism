name: "Release Prism Desktop App"

concurrency:
  group: prism-release-main
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  version:
    needs: notebook-runtime
    if: github.ref_type == 'branch' && github.ref_name == 'main' && needs.notebook-runtime.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create next patch tag
        id: next-version
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess

          tags = subprocess.check_output(
              ["git", "tag", "--list", "v*", "--sort=-version:refname"],
              text=True,
          ).splitlines()
          latest = tags[0] if tags else f"v{json.loads(open('package.json').read())['version']}"
          match = re.fullmatch(r"v([0-9]+)\.([0-9]+)\.([0-9]+)", latest)
          if not match:
              raise SystemExit(f"Latest tag '{latest}' is not a stable semantic version")

          major, minor, patch = (int(value) for value in match.groups())
          tag = f"v{major}.{minor}.{patch + 1}"
          print(f"Creating release tag {tag}")
          subprocess.run(["git", "tag", tag], check=True)
          subprocess.run(["git", "push", "origin", tag], check=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")

  notebook-runtime:
    uses: ./.github/workflows/notebook-runtime.yml
  release:
    needs: [version, notebook-runtime]
    if: always() && needs.notebook-runtime.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Frontend Dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: notebook-*
          path: notebook-artifacts
          merge-multiple: true
      - name: Install validated Notebook resource payloads
        shell: python
        run: |
          import pathlib, platform, tarfile
          for archive in pathlib.Path('notebook-artifacts').glob('*.tar.gz'):
              if ('windows' in archive.name) != (platform.system() == 'Windows'):
                  continue
              with tarfile.open(archive) as payload:
                  payload.extractall('src-tauri/notebook-runtime', filter='data')

      - name: Sync version across package.json, tauri.conf.json, and Cargo.toml
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag || github.ref_name }}
        run: |
          # Strip 'v' prefix from the release tag and export for node.
          export VERSION="${RELEASE_TAG#v}"
          echo "Syncing all manifests to version: $VERSION"

          # Guard: MSI and macOS bundles require a stable numeric semver.
          # In particular, MSI rejects alphabetic prereleases such as 1.0.5-a.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must be a stable semver like v1.0.5; alphabetic prereleases are not supported by the MSI bundle."
            exit 1
          fi

          # 1. package.json + package-lock.json. Skip when already at VERSION —
          #    `npm version` exits 1 with "Version not changed" in that case.
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
          else
            echo "package.json already at $VERSION — skipping npm version"
          fi

          # 2. tauri.conf.json + 3. Cargo.toml via node. Avoids jq (absent on
          #    windows-latest runners) and GNU-only sed address syntax (macOS
          #    ships BSD sed which rejects `0,/re/`).
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;

            const tauriPath = "src-tauri/tauri.conf.json";
            const tauri = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
            tauri.version = v;
            fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + "\n");
            console.log("tauri.conf.json -> " + v);

            const cargoPath = "src-tauri/Cargo.toml";
            const cargo = fs.readFileSync(cargoPath, "utf8");
            const next = cargo.replace(/^version = .*$/m, "version = \"" + v + "\"");
            fs.writeFileSync(cargoPath, next);
            console.log("Cargo.toml -> " + v);
          '

          # Sanity check
          echo "--- Cargo.toml ---"
          grep -E '^version =' src-tauri/Cargo.toml
          echo "--- tauri.conf.json ---"
          node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version"
          echo "--- package.json ---"
          node -p "require('./package.json').version"

      - name: Install ONNX Runtime for Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'onnxruntime-win-x64-1.18.1.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'onnxruntime-win-x64-1.18.1'
          Invoke-WebRequest `
            -Uri 'https://github.com/microsoft/onnxruntime/releases/download/v1.18.1/onnxruntime-win-x64-1.18.1.zip' `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $importLibrary = Get-ChildItem -Path $destination -File -Recurse -Filter onnxruntime.lib | Select-Object -First 1
          if (-not $importLibrary) {
            Get-ChildItem -Path $destination -Recurse | Select-Object -ExpandProperty FullName
            throw 'ONNX Runtime import library was not found'
          }
          $libDirectory = $importLibrary.DirectoryName
          "ORT_LIB_LOCATION=$libDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # The library directory itself contains the import library and DLL.
          # A dot profile also enables ort-sys's copy-dylibs path for the DLL.
          "ORT_LIB_PROFILE=." | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install ONNX Runtime for macOS
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/onnxruntime-osx-universal2-1.18.1.tgz"
          destination="$RUNNER_TEMP/onnxruntime-osx-universal2-1.18.1"
          curl --fail --location --retry 3 \
            'https://github.com/microsoft/onnxruntime/releases/download/v1.18.1/onnxruntime-osx-universal2-1.18.1.tgz' \
            --output "$archive"
          mkdir -p "$destination"
          tar -xzf "$archive" -C "$destination"
          lib_file="$(find "$destination" -path '*/lib/libonnxruntime.dylib' -print -quit)"
          if [ -z "$lib_file" ]; then
            echo 'ONNX Runtime universal2 library was not found' >&2
            exit 1
          fi
          lib_dir="$(dirname "$lib_file")"
          lib_root="$(dirname "$lib_dir")"
          # Tauri signs and embeds files listed under bundle.macOS.frameworks.
          # Keep this generated binary out of git while making it available
          # at the stable path used by tauri.conf.json.
          runtime_lib="$(find "$lib_dir" -name 'libonnxruntime.1.18.1.dylib' -print -quit)"
          if [ -z "$runtime_lib" ]; then
            echo 'Versioned ONNX Runtime dylib was not found' >&2
            exit 1
          fi
          mkdir -p src-tauri/onnxruntime
          cp -L "$runtime_lib" src-tauri/onnxruntime/libonnxruntime.1.18.1.dylib
          # Add the generated dylib only for this release build. Keeping it
          # out of the checked-in config lets local builds use their normal
          # ORT installation without requiring a downloaded binary.
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const tauri = JSON.parse(fs.readFileSync(path, "utf8"));
            tauri.bundle.macOS = tauri.bundle.macOS || {};
            tauri.bundle.macOS.frameworks = ["./onnxruntime/libonnxruntime.1.18.1.dylib"];
            fs.writeFileSync(path, JSON.stringify(tauri, null, 2));
          '
          echo "ORT_LIB_LOCATION=$lib_root" >> "$GITHUB_ENV"
          echo 'ORT_LIB_PROFILE=lib' >> "$GITHUB_ENV"

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag || github.ref_name }}
          releaseName: "Prism ${{ needs.version.outputs.tag || github.ref_name }}"
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseBody: "See the assets below to download Prism for your operating system."
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin -- --bin app' || '-- --bin app' }}
