name: Native ingestor contracts
on:
  pull_request:
    paths: ['src-tauri/src/ingest/**', 'src-tauri/src/native_ingest.rs', 'scripts/*ingest*', '.github/workflows/ingest.yml']
  workflow_dispatch:
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/src/ingest
      - run: cargo test --locked --manifest-path src-tauri/src/ingest/Cargo.toml
      - run: cargo check --locked --manifest-path src-tauri/src/ingest/Cargo.toml --features pdfium,ml,browser
