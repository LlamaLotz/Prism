[package]
name = "app"
version = "0.1.0"
description = "Prism — Neural Markdown & Knowledge Vault"
authors = ["Prism"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "app"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Rust-backed fetch for the AI Co-Pilot: the OpenAI SDK runs in the webview,
# and WebView2's own network stack can fail (proxy/TLS quirks) where plain
# HTTP clients succeed — routing requests through reqwest here bypasses it.
tauri-plugin-http = "2"
scraper = "0.22"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "multipart", "stream", "blocking"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
fs2 = "0.4"
urlencoding = "2"
rfd = "0.15"
walkdir = "2"
aho-corasick = "1.1"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
sha2 = "0.10"
base64 = "0.22"
memmap2 = "0.9"
tempfile = "3.10"
notify = "6.1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
# Prism patch: vendored fastembed with the ONNX intra-op thread pool capped
# at 2 threads. Stock fastembed spins up one thread per logical CPU, so the
# embedding job that runs on every note save saturates all cores (~96% CPU
# spike). See vendor/fastembed/src/text_embedding.rs.
#
# Also vendored: hf-hub 0.3.2 with a patch to `Api::metadata` so relative
# `Location` redirect headers (HF/CloudFront) are resolved against the
# endpoint instead of failing with `RelativeUrlWithoutBase`. See
# vendor/hf-hub/src/api/sync.rs.
fastembed = { path = "vendor/fastembed", features = ["ort-download-binaries", "ort-copy-dylibs", "ort-load-dynamic", "online"] }
hnsw_rs = "0.3"
rayon = "1.10"
[patch.crates-io]
fastembed = { path = "vendor/fastembed" }
hf-hub = { path = "vendor/hf-hub" }

[target.'cfg(windows)'.dependencies]
# Direct use of the WebView2 COM bindings (same version wry/tauri use) so the
# app can disable browser accelerator keys natively — JS preventDefault cannot
# stop WebView2's own handling of Ctrl+P / Ctrl+R / F5 / F12 / etc.
webview2-com = "0.38.2"
# For Interface::cast (up-casting ICoreWebView2Settings -> Settings3, which
# carries AreBrowserAcceleratorKeysEnabled).
windows-core = "0.61.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "^2"

[features]
# Opt-in native IPC regression harness; never enabled in release packaging.
settings-smoke = []

[[bin]]
name = "settings-smoke"
path = "src/bin/settings_smoke.rs"
required-features = ["settings-smoke"]
